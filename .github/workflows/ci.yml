name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mariadb]

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: workorders_test
          MARIADB_USER: app
          MARIADB_PASSWORD: app
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # check_red needs the base branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Lint (ruff)
        if: matrix.db == 'sqlite'
        run: ruff check .

      - name: Types (pyrefly, project and hooks)
        if: matrix.db == 'sqlite'
        run: python -m tools.check_types

      - name: Test (SQLite)
        if: matrix.db == 'sqlite'
        run: pytest -v

      - name: FP discipline (check_fp)
        if: matrix.db == 'sqlite'
        run: python -m tools.check_fp

      # Every new test must fail against the base branch's code.
      - name: RED first (check_red)
        if: matrix.db == 'sqlite' && github.event_name == 'pull_request'
        run: python -m tools.check_red --base origin/${{ github.base_ref }}

      # The suite must FAIL when tenant filters or transition rules are broken.
      - name: Mutation check (SQLite)
        if: matrix.db == 'sqlite'
        run: python -m tools.mutation_check

      - name: Test (MariaDB)
        if: matrix.db == 'mariadb'
        env:
          TEST_DATABASE_URL: mysql+aiomysql://app:app@127.0.0.1:3306/workorders_test
        run: pytest -v
