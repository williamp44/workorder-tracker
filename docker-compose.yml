services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: workorders
      MARIADB_USER: app
      MARIADB_PASSWORD: app
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20
    volumes:
      - mariadb-data:/var/lib/mysql
      # Creates the separate test database on first start.
      - ./scripts/mariadb-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  mariadb-data:
